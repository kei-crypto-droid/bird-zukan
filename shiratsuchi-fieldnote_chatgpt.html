<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>白神山地の野鳥ガイド | シラツチ フィールドノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Yomogi&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1B1613;
    --bg-elevated: #262019;
    --bg-elevated-2: #302921;
    --border: #3A3129;
    --text-primary: #F3E9DA;
    --text-secondary: #A79684;
    --text-tertiary: #786A5B;
    --accent: #4F7F52;
    --accent-dark: #3B613E;
    --dot-bird: #4F7F52;
    --dot-insect: #6B9950;
    --dot-mammal: #71864A;
    --dot-herp: #4E86A8;
    --dot-fish: #5FA6B8;
    --dot-other: #8C8272;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    position: relative;
  }

  .hero { padding: 28px 20px 8px; }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--text-secondary);
    margin: 0 0 10px;
  }

  .logo-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 0 0 14px;
  }

  .logo-row img { flex-shrink: 0; display: block; }

  .logo-title {
    font-family: 'Yomogi', 'Shippori Mincho', serif;
    font-size: 23px;
    line-height: 1.45;
    font-weight: 400;
    color: var(--text-primary);
    margin: 0;
  }

  .stats {
    font-size: 13px;
    color: var(--text-secondary);
    margin: 0 0 16px;
  }

  .stats strong { color: var(--text-primary); font-weight: 700; }

  .chips-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 0 20px 16px;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 8px 12px;
    font-size: 12.5px;
    color: var(--text-primary);
    cursor: pointer;
  }

  .chip.active {
    border-color: var(--accent);
    background: var(--bg-elevated-2);
  }

  .chip .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .chip .chip-val {
    color: var(--text-secondary);
    font-size: 11.5px;
  }


  #view-list { padding: 0 20px; }

  .record-item {
    display: flex;
    gap: 12px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
  }

  .thumb {
    width: 60px;
    height: 60px;
    flex-shrink: 0;
    border-radius: 8px;
    background: var(--bg-elevated);
    overflow: hidden;
  }

  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .info { flex: 1; min-width: 0; }

  .species {
    font-family: 'Shippori Mincho', serif;
    font-size: 16px;
    color: var(--text-primary);
  }

  .meta {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 3px;
  }

  .memo {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 4px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .delete-btn {
    align-self: flex-start;
    background: none;
    border: none;
    color: var(--text-tertiary);
    font-size: 12px;
    padding: 4px 0 4px 8px;
    cursor: pointer;
    white-space: nowrap;
  }

  #empty-state {
    padding: 44px 12px 40px;
    text-align: center;
    color: var(--text-secondary);
  }

  #empty-state svg { color: var(--text-tertiary); margin-bottom: 14px; }

  .empty-title {
    font-family: 'Shippori Mincho', serif;
    font-size: 17px;
    color: var(--text-primary);
    margin: 0 0 8px;
  }

  .empty-sub { font-size: 13px; margin: 0; line-height: 1.7; }

  #bottom-bar {
    position: static;
    width: 100%;
    display: flex;
    gap: 10px;
    padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
    background: var(--bg);
    border-top: 1px solid var(--border);
    margin-top: 8px;
  }

  #btn-new-record {
    flex: 1;
    padding: 14px;
    background: var(--accent);
    color: #fff;
    border: 1px solid var(--accent-dark);
    border-radius: 999px;
    font-family: 'Shippori Mincho', serif;
    font-size: 15.5px;
    letter-spacing: 0.02em;
    cursor: pointer;
  }

  #btn-quick-camera {
    width: 50px;
    height: 50px;
    flex-shrink: 0;
    border-radius: 50%;
    background: var(--bg-elevated-2);
    border: 1px solid var(--border);
    color: var(--text-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  #view-entry { padding-bottom: 24px; }

  .entry-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 20px;
    border-bottom: 1px solid var(--border);
  }

  .text-btn {
    background: none;
    border: none;
    font-size: 20px;
    color: var(--text-primary);
    padding: 4px 6px;
    cursor: pointer;
    line-height: 1;
  }

  .entry-title {
    font-family: 'Shippori Mincho', serif;
    font-size: 19px;
    color: var(--text-primary);
    margin: 0;
    flex: 1;
  }

  .icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--text-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }

  .image-preview {
    margin: 16px 20px 0;
    aspect-ratio: 4 / 3;
    background: var(--bg-elevated);
    border: 1px dashed var(--border);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    color: var(--text-secondary);
    font-size: 13px;
    text-align: center;
    padding: 16px;
  }

  .image-preview img { width: 100%; height: 100%; object-fit: cover; }

  .ai-status {
    margin: 10px 20px 0;
    font-size: 13px;
    color: var(--accent);
  }
  .field input[type="date"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg-elevated);
    color: var(--text-primary);
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    color-scheme: dark;
  }

  .lens-btn:active { opacity: .75; }

  .form {
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .field label {
    display: block;
    font-size: 12.5px;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }

  .field input, .field textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg-elevated);
    font-size: 15px;
    color: var(--text-primary);
    font-family: inherit;
  }

  .field input:focus, .field textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .field textarea { resize: vertical; }

  .category-picker {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .cat-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 8px 12px;
    font-size: 12.5px;
    color: var(--text-primary);
    cursor: pointer;
  }

  .cat-pill.selected {
    border-color: var(--accent);
    background: var(--bg-elevated-2);
  }

  .cat-pill .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .save-btn {
    padding: 14px;
    background: var(--accent);
    color: #fff;
    border: 1px solid var(--accent-dark);
    border-radius: 999px;
    font-family: 'Shippori Mincho', serif;
    font-size: 15.5px;
    letter-spacing: 0.02em;
    cursor: pointer;
    margin-top: 4px;
  }

  .toast {
    position: fixed;
    bottom: 96px;
    left: 50%;
    transform: translateX(-50%) translateY(8px);
    background: var(--bg-elevated-2);
    color: var(--text-primary);
    border: 1px solid var(--border);
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 13.5px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 20;
    white-space: nowrap;
  }

  .toast.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'shiratsuchi_sightings_v1';

  var CATEGORIES = [
    { key: 'bird', label: '鳥', dot: '#4F7F52', total: 94 },
    { key: 'other', label: 'その他の生き物', dot: '#8C8272', total: null },
    { key: 'tree', label: '樹木', dot: '#5B8A4A', total: null }
  ];
  var CATEGORY_KEYS = CATEGORIES.map(function (c) { return c.key; });
  var CATEGORY_MAP = {};
  CATEGORIES.forEach(function (c) { CATEGORY_MAP[c.key] = c; });

  var records = [];
  var currentPhotoDataUrl = null;
  var selectedCategory = 'bird';
  var activeCategoryFilter = null;
  var quickCaptureMode = false;

  var els = {
    chipsRow: document.getElementById('chips-row'),
    statRecords: document.getElementById('stat-records'),
    statSpecies: document.getElementById('stat-species'),
    viewList: document.getElementById('view-list'),
    viewEntry: document.getElementById('view-entry'),
    listContainer: document.getElementById('list-container'),
    emptyState: document.getElementById('empty-state'),
    bottomBar: document.getElementById('bottom-bar'),
    btnNewRecord: document.getElementById('btn-new-record'),
    btnQuickCamera: document.getElementById('btn-quick-camera'),
    btnBack: document.getElementById('btn-back'),
    btnAiPhoto: document.getElementById('btn-ai-photo'),
    photoInput: document.getElementById('photo-input'),
    imagePreview: document.getElementById('image-preview'),
    aiStatus: document.getElementById('ai-status'),
    categoryPicker: document.getElementById('category-picker'),
    inputSpecies: document.getElementById('input-species'),
    inputDate: document.getElementById('input-date'),
    inputLocation: document.getElementById('input-location'),
    inputMemo: document.getElementById('input-memo'),
    btnSave: document.getElementById('btn-save'),
    toast: document.getElementById('toast')
  };

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str == null ? '' : str;
    return div.innerHTML;
  }

  function todayStr() {
    var d = new Date();
    var pad = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function updateDateDisplay() {
    if (!els.inputDate.value) els.inputDate.value = todayStr();
  }



  function confidenceLabel(c) {
    if (c === 'high') return '高';
    if (c === 'medium') return '中';
    if (c === 'low') return '低';
    return c || '';
  }

  async function loadRecords() {
    records = [];
    try {
      var value = window.localStorage.getItem(STORAGE_KEY);
      if (value) {
        var parsed = JSON.parse(value);
        if (Array.isArray(parsed)) { records = parsed; }
      }
    } catch (err) {
      // key doesn't exist yet on first run, or a storage error occurred
      console.error('failed to load records', err);
    }
    records.sort(function (a, b) {
      return (b.createdAt || '').localeCompare(a.createdAt || '');
    });
  }


  function renderStats() {
    els.statRecords.textContent = records.length;
    var distinctSpecies = new Set(records.map(function (r) { return r.species; })).size;
    els.statSpecies.textContent = distinctSpecies;
  }

  function renderChips() {
    var counts = {};
    CATEGORIES.forEach(function (c) { counts[c.key] = new Set(); });
    records.forEach(function (r) {
      if (r.category && counts[r.category] && r.species) {
        counts[r.category].add(r.species);
      }
    });

    els.chipsRow.innerHTML = '';
    CATEGORIES.forEach(function (cat) {
      var count = counts[cat.key].size;
      var valueText = cat.total
        ? count + '/' + cat.total + '  ' + Math.round((count / cat.total) * 100) + '%'
        : count + '種';

      var chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip' + (activeCategoryFilter === cat.key ? ' active' : '');
      chip.innerHTML =
        '<span class="dot" style="background:' + cat.dot + '"></span>' +
        cat.label + ' <span class="chip-val">' + valueText + '</span>';
      chip.addEventListener('click', function () {
        activeCategoryFilter = (activeCategoryFilter === cat.key) ? null : cat.key;
        renderChips();
        renderList();
      });
      els.chipsRow.appendChild(chip);
    });
  }

  function renderCategoryPicker() {
    els.categoryPicker.innerHTML = '';
    CATEGORIES.forEach(function (cat) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'cat-pill' + (selectedCategory === cat.key ? ' selected' : '');
      btn.innerHTML = '<span class="dot" style="background:' + cat.dot + '"></span>' + cat.label;
      btn.addEventListener('click', function () {
        selectedCategory = cat.key;
        renderCategoryPicker();
      });
      els.categoryPicker.appendChild(btn);
    });
  }

  function getFilteredRecords() {
    var q = '';
    return records.filter(function (r) {
      var matchesCategory = !activeCategoryFilter || r.category === activeCategoryFilter;
      var matchesQuery = !q ||
        (r.species && r.species.toLowerCase().indexOf(q) !== -1) ||
        (r.location && r.location.toLowerCase().indexOf(q) !== -1);
      return matchesCategory && matchesQuery;
    });
  }

  function renderList() {
    var filtered = getFilteredRecords();
    els.listContainer.innerHTML = '';

    if (filtered.length === 0) {
      els.emptyState.hidden = false;
      var title = els.emptyState.querySelector('.empty-title');
      var sub = els.emptyState.querySelector('.empty-sub');
      if (records.length === 0) {
        title.textContent = 'まだ記録がありません';
        sub.textContent = '下のボタンから、最初の観察を記録しましょう。';
      } else {
        title.textContent = '該当する記録がありません';
        sub.textContent = '絞り込み条件を変えてみてください。';
      }
      return;
    }
    els.emptyState.hidden = true;

    filtered.forEach(function (rec) {
      var cat = CATEGORY_MAP[rec.category];
      var item = document.createElement('div');
      item.className = 'record-item';

      var thumbHtml = rec.image
        ? '<img src="' + rec.image + '" alt="' + escapeHtml(rec.species || '記録') + '">'
        : '';

      var metaParts = [];
      if (rec.date) metaParts.push(escapeHtml(rec.date));
      if (rec.location) metaParts.push(escapeHtml(rec.location));
      if (cat) metaParts.push(escapeHtml(cat.label));

      item.innerHTML =
        '<div class="thumb">' + thumbHtml + '</div>' +
        '<div class="info">' +
          '<div class="species">' + escapeHtml(rec.species || '種名未記入') + '</div>' +
          '<div class="meta">' + metaParts.join(' ・ ') + '</div>' +
          (rec.memo ? '<div class="memo">' + escapeHtml(rec.memo) + '</div>' : '') +
        '</div>' +
        '<button class="delete-btn" data-id="' + escapeHtml(rec.id) + '">削除</button>';

      els.listContainer.appendChild(item);
    });

    els.listContainer.querySelectorAll('.delete-btn').forEach(function (btn) {
      btn.addEventListener('click', onDeleteClick);
    });
  }

  async function onDeleteClick(e) {
    var btn = e.currentTarget;
    if (btn.dataset.confirming === 'true') {
      var id = btn.dataset.id;
      records = records.filter(function (r) { return r.id !== id; });
      try {
        window.localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
      } catch (err) {
        console.error('delete failed', err);
      }
      renderStats();
      renderChips();
      renderList();
      showToast('削除しました');
    } else {
      btn.dataset.confirming = 'true';
      btn.textContent = '本当に削除しますか？';
      setTimeout(function () {
        if (btn.dataset.confirming === 'true') {
          btn.dataset.confirming = 'false';
          btn.textContent = '削除';
        }
      }, 3000);
    }
  }

  function dataUrlToFile(dataUrl, filename) {
    try {
      var parts = dataUrl.split(',');
      var mime = (parts[0].match(/:(.*?);/) || [,'image/jpeg'])[1];
      var binary = atob(parts[1]);
      var len = binary.length;
      var bytes = new Uint8Array(len);
      for (var i = 0; i < len; i++) bytes[i] = binary.charCodeAt(i);
      return new File([bytes], filename, { type: mime });
    } catch (err) {
      return null;
    }
  }



  function openEntryView(prefill) {
    prefill = prefill || {};
    currentPhotoDataUrl = prefill.image || null;
    selectedCategory = prefill.category || 'bird';

    els.imagePreview.innerHTML = currentPhotoDataUrl
      ? '<img src="' + currentPhotoDataUrl + '" alt="選択した写真">'
      : '<span>写真を選ぶとAIが判定して自動記録します</span>';

    els.aiStatus.hidden = !prefill.statusText;
    els.aiStatus.textContent = prefill.statusText || '';

    els.inputSpecies.value = prefill.species || '';
    els.inputSpecies.style.borderColor = '';
    els.inputLocation.value = '';
    els.inputMemo.value = '';
    els.inputDate.value = prefill.date || todayStr();
    updateDateDisplay();

    renderCategoryPicker();

    els.viewList.hidden = true;
    els.bottomBar.hidden = true;
    els.viewEntry.hidden = false;
  }

  function closeEntryView() {
    els.viewEntry.hidden = true;
    els.viewList.hidden = false;
    els.bottomBar.hidden = false;
  }

  function compressImage(file, maxSize, quality) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function (e) {
        var img = new Image();
        img.onload = function () {
          var width = img.width;
          var height = img.height;
          if (width > height) {
            if (width > maxSize) {
              height = Math.round(height * (maxSize / width));
              width = maxSize;
            }
          } else {
            if (height > maxSize) {
              width = Math.round(width * (maxSize / height));
              height = maxSize;
            }
          }
          var canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = function () { reject(new Error('image load failed')); };
        img.src = e.target.result;
      };
      reader.onerror = function () { reject(new Error('file read failed')); };
      reader.readAsDataURL(file);
    });
  }

  async function identifySpecies(dataUrl) {
    try {
      var response = await fetch('/api/identify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: dataUrl })
      });
      if (!response.ok) {
        var errorBody = await response.text();
        var apiErr = new Error('AI server ' + response.status + ': ' + errorBody);
        apiErr.status = response.status;
        throw apiErr;
      }
      var parsed = await response.json();
      if (!parsed.species) return null;
      if (CATEGORY_KEYS.indexOf(parsed.category) === -1) parsed.category = null;
      return parsed;
    } catch (err) {
      console.error('identifySpecies error', err);
      els.aiStatus.hidden = false;
      if (err && (err.message || '').indexOf('Failed to fetch') !== -1) {
        els.aiStatus.textContent = 'AIサーバーに接続できません。アプリのサーバー設定を確認してください。';
      } else if (err && err.status === 429) {
        els.aiStatus.textContent = 'AIの利用上限または残高を確認してください。';
      } else {
        els.aiStatus.textContent = 'AI判定に失敗しました。通信状態を確認してください。';
      }
      return null;
    }
  }

  async function persistRecord(record) {
    records.unshift(record);
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    } catch (err) {
      records.shift();
      throw err;
    }
    renderStats();
    renderChips();
    renderList();
  }


  async function onPhotoSelected(e) {
    var file = e.target.files && e.target.files[0];
    if (!file) { return; }
    var wasQuick = quickCaptureMode;
    quickCaptureMode = false;

    try {
      var dataUrl = await compressImage(file, 900, 0.75);
      currentPhotoDataUrl = dataUrl;
      els.imagePreview.innerHTML = '<img src="' + dataUrl + '" alt="選択した写真">';
      els.aiStatus.hidden = false;
      els.aiStatus.textContent = 'AIが野鳥を判定しています…';

      var result = await identifySpecies(dataUrl);
      if (!result || !result.species) {
        if (wasQuick) {
          openEntryView({ image: dataUrl, statusText: els.aiStatus.textContent || 'AI判定できませんでした。' });
        }
        return;
      }

      var newRecord = {
        id: String(Date.now()),
        species: result.species,
        category: result.category || 'bird',
        date: els.inputDate.value || todayStr(),
        location: els.inputLocation.value.trim(),
        memo: result.note || '',
        image: dataUrl,
        createdAt: new Date().toISOString()
      };

      await persistRecord(newRecord);
      var confText = result.confidence ? '（確信度: ' + confidenceLabel(result.confidence) + '）' : '';
      closeEntryView();
      showToast('AIが判定して自動記録しました: ' + result.species + confText);
    } catch (err) {
      console.error('photo processing error', err);
      els.aiStatus.hidden = false;
      els.aiStatus.textContent = '画像の処理に失敗しました。写真・通信状態を確認してください。';
    } finally {
      e.target.value = '';
    }
  }

  async function onSave() {
    var species = els.inputSpecies.value.trim();
    if (!species) {
      els.inputSpecies.focus();
      els.inputSpecies.style.borderColor = 'var(--accent)';
      return;
    }

    var record = {
      id: String(Date.now()),
      species: species,
      category: selectedCategory,
      date: els.inputDate.value || todayStr(),
      location: els.inputLocation.value.trim(),
      memo: els.inputMemo.value.trim(),
      image: currentPhotoDataUrl,
      createdAt: new Date().toISOString()
    };

    try {
      await persistRecord(record);
      closeEntryView();
      showToast('記録を追加しました');
    } catch (err) {
      console.error('save failed', err);
      showToast('保存に失敗しました');
    }
  }


  function bindEvents() {
    els.btnNewRecord.addEventListener('click', function () { openEntryView(); });
    els.btnQuickCamera.addEventListener('click', function () {
      quickCaptureMode = true;
    });
    els.btnBack.addEventListener('click', closeEntryView);
    els.btnAiPhoto.addEventListener('click', function () {
      quickCaptureMode = false;
    });
    els.photoInput.addEventListener('change', onPhotoSelected);
    els.btnSave.addEventListener('click', onSave);
  }

  async function init() {
    bindEvents();
    updateDateDisplay();
    await loadRecords();
    renderStats();
    renderChips();
    renderList();
  }

  init();
})();
</script>
