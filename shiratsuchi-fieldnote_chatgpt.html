<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101913">
<title>白土｜野鳥フィールドノート</title>
<style>
:root{color-scheme:dark;--bg:#101913;--surface:#17231b;--surface-2:#1e2d22;--line:#304236;--text:#edf3e9;--muted:#a2b19f;--green:#8dbb78;--green-strong:#477c4e;--gold:#d2b77e;--danger:#e1a29a;--shadow:0 18px 50px #0005}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% -15%,#29402c 0,transparent 45%),var(--bg);color:var(--text);font:400 15px/1.6 system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;min-height:100vh}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--green);outline-offset:2px}
#app{width:min(100%,680px);margin:auto;padding:0 18px calc(104px + env(safe-area-inset-bottom))}
header{padding:26px 2px 18px}
.brand{display:flex;align-items:center;gap:12px}
.mark{display:grid;place-items:center;width:44px;height:44px;border-radius:15px;background:linear-gradient(145deg,#5f9060,#315e3a);font-size:23px;box-shadow:0 8px 24px #102b17}
.eyebrow{font-size:10px;letter-spacing:.2em;color:var(--green);font-weight:700}
h1{font-size:25px;line-height:1.25;margin:2px 0 0;letter-spacing:.03em}
.subtitle{color:var(--muted);font-size:12px;margin:13px 0 17px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,#1b2a20,#152119)}
.stat strong{display:block;font-size:21px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.tools{display:flex;gap:9px;margin:3px 0 13px}
.search-wrap{position:relative;flex:1}
.search-wrap span{position:absolute;left:13px;top:9px;color:var(--muted);font-size:18px}
.search{width:100%;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);padding:0 12px 0 38px}
.export{height:42px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--muted);padding:0 12px;font-size:12px}
.filters{display:flex;gap:7px;overflow-x:auto;padding:0 0 13px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter{white-space:nowrap;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);padding:7px 12px;font-size:12px}
.filter.active{border-color:#5f8d61;background:#203626;color:var(--text)}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 4px}
.section-head h2{font-size:15px;margin:4px 0;font-weight:600}
.section-head span{font-size:11px;color:var(--muted)}
#records-list{min-height:80px}
.record{display:grid;grid-template-columns:74px minmax(0,1fr) auto;gap:12px;align-items:start;padding:13px 2px;border-bottom:1px solid #ffffff12}
.thumb{width:74px;height:74px;border-radius:13px;overflow:hidden;background:linear-gradient(145deg,#243829,#17251c);display:grid;place-items:center;color:var(--green);font-size:28px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.record-main{min-width:0}
.species{font-size:17px;font-weight:650;letter-spacing:.01em;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:11px;margin-top:2px;overflow-wrap:anywhere}
.memo{color:#c4cfc0;font-size:12px;margin-top:6px;overflow-wrap:anywhere}
.confidence{display:inline-flex;align-items:center;border-radius:999px;background:#263a29;color:#bcd3b5;padding:2px 7px;font-size:10px;margin-top:6px}
.remove{background:none;border:0;color:#899587;font-size:11px;padding:6px 2px}
.empty{padding:48px 18px;text-align:center;color:var(--muted)}
.empty .bird{font-size:35px;margin-bottom:7px}
.empty strong{display:block;color:var(--text);font-size:16px}
.empty p{font-size:12px;margin:5px 0}
#entry-view{display:none}
.entry-top{display:flex;align-items:center;gap:11px;margin:8px 0 14px}
.back{width:38px;height:38px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);font-size:21px}
.entry-top h2{font-size:19px;margin:0}
.entry-top p{font-size:11px;color:var(--muted);margin:0}
.photo-box{position:relative;display:grid;place-items:center;min-height:190px;border:1px dashed #4c6650;border-radius:18px;background:linear-gradient(145deg,#1a291d,#142018);overflow:hidden;text-align:center;color:var(--muted)}
.photo-box img{display:block;width:100%;max-height:320px;object-fit:contain;background:#0d130f}.photo-actions{display:flex;gap:8px;margin:0 0 10px}.photo-actions .secondary{flex:.8}.photo-actions .primary{flex:1}
.photo-placeholder{padding:28px 18px}
.photo-placeholder b{display:block;color:#dce8d8;font-size:14px;margin:5px 0}
.photo-placeholder small{font-size:11px}
#ai-status{min-height:25px;color:var(--green);font-size:12px;padding:6px 3px}
#ai-status.error{color:var(--danger)}
.field{margin:13px 0}
.field label{display:block;color:var(--muted);font-size:12px;margin:0 0 6px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--text);padding:11px 12px}
.field textarea{resize:vertical;min-height:72px}
.category-options{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.category-option{border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--muted);padding:10px 6px;font-size:12px}
.category-option.selected{border-color:#5f8d61;background:#203626;color:var(--text)}
.entry-actions{display:flex;gap:9px;margin:18px 0}
.primary,.secondary{min-height:46px;border-radius:12px;padding:10px 15px;font-weight:600}
.primary{flex:1;border:0;background:linear-gradient(135deg,#56865a,#3d6b45);color:white}
.secondary{border:1px solid var(--line);background:var(--surface);color:var(--text)}
.bottom{position:fixed;z-index:4;bottom:0;left:0;right:0;padding:11px 18px calc(11px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#101913ee,#101913);border-top:1px solid #ffffff14}
.bottom-inner{width:min(100%,644px);margin:auto;display:flex;gap:9px}
.bottom button,.bottom .ai-btn{height:48px;border:0;border-radius:999px;font-weight:650}.bottom .ai-btn{display:flex;align-items:center;justify-content:center;text-align:center}
.add-btn{flex:1;background:var(--surface-2);border:1px solid #38513d!important;color:var(--text)}
.ai-btn{position:relative;overflow:hidden;flex:1.2;background:linear-gradient(135deg,#699363,#47774e);color:#fff;box-shadow:0 7px 22px #244c2b66}.ai-btn input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:auto;cursor:pointer;z-index:2}
#photo-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.toast{position:fixed;z-index:10;left:50%;bottom:78px;transform:translate(-50%,12px);opacity:0;pointer-events:none;background:#e8f0e4;color:#1c2c1e;padding:10px 15px;border-radius:12px;box-shadow:var(--shadow);font-size:12px;transition:.2s;max-width:calc(100% - 36px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:600px){#app{padding-top:8px}.bottom{left:50%;right:auto;transform:translateX(-50%);width:min(100%,680px);border-left:1px solid #ffffff14;border-right:1px solid #ffffff14;border-radius:16px 16px 0 0}}
@media(max-width:380px){#app{padding-left:13px;padding-right:13px}.record{grid-template-columns:62px minmax(0,1fr) auto;gap:9px}.thumb{width:62px;height:62px}.stats{gap:6px}.stat{padding:10px}.ai-btn,.add-btn{font-size:12px}}

    </div>
    <div id="ai-status" role="status" aria-live="polite"></div>
    <div class="photo-actions"><button id="choose-photo-btn" class="secondary" type="button">写真を選ぶ</button><button id="recognize-photo-btn" class="primary" type="button">AI判定して入力</button></div>
    <div class="field"><label for="species-input">種名</label><input id="species-input" autocomplete="off" placeholder="例：コサメビタキ"></div>
    <div class="field"><label>分類</label><div class="category-options" id="category-options">
      <button class="category-option selected" type="button" data-category="bird">鳥</button>
      <button class="category-option" type="button" data-category="other">その他</button>
      <button class="category-option" type="button" data-category="tree">樹木</button>
    </div></div>
    <div class="field"><label for="date-input">観察日</label><input id="date-input" type="date"></div>
    <div class="field"><label for="location-input">場所</label><input id="location-input" autocomplete="off" placeholder="例：白神山地"></div>
    <div class="field"><label for="memo-input">観察メモ</label><textarea id="memo-input" placeholder="行動や見分けた特徴をメモ"></textarea></div>
    <div class="entry-actions"><button id="save-btn" class="primary" type="button">この内容で記録</button><button id="cancel-btn" class="secondary" type="button">キャンセル</button></div>
  </section>
</div>
<div class="bottom" id="bottom-bar"><div class="bottom-inner">
  <button id="new-record-btn" class="add-btn" type="button">＋ 手入力で追加</button>
  <label id="ai-photo-label" class="ai-btn">📷 写真からAI判定<input id="home-photo-input" type="file" accept="image/*" aria-label="写真からAI判定"></label>
</div></div>
<input id="photo-input" type="file" accept="image/*" aria-label="判定する写真を選択">
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
(() => {
  'use strict';
  const STORAGE_KEY = 'shiratsuchi_sightings_v1';
  const API_ENDPOINT = 'https://bird-zukan-api-96392505892.asia-northeast1.run.app/api/identify';
  const CATEGORIES = [
    {key:'bird',label:'鳥'},
    {key:'other',label:'その他の生きもの'},
    {key:'tree',label:'樹木'}
  ];
  const $ = id => document.getElementById(id);
  const els = {
    home:$('home-view'), entry:$('entry-view'), bottom:$('bottom-bar'),
    list:$('records-list'), filters:$('filters'), search:$('search-input'),
    photoInput:$('photo-input'), homePhotoInput:$('home-photo-input'), photoBox:$('photo-box'), aiStatus:$('ai-status'), recognize:$('recognize-photo-btn'),
    species:$('species-input'), date:$('date-input'), location:$('location-input'),
    memo:$('memo-input'), toast:$('toast')
  };
  let records = [];
  let activeFilter = 'all';
  let selectedCategory = 'bird';
  let photoData = null;
  let confidenceValue = null;
  let toastTimer = null;
  let identificationRun = 0;

  function today() {
    const d = new Date();
    return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
  }
  function safeText(value) { return String(value == null ? '' : value); }
  function setText(node,value) { node.textContent = safeText(value); }
  function flash(message) {
    setText(els.toast,message);
    els.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => els.toast.classList.remove('show'),2600);
  }
  function categoryLabel(key) {
    const item = CATEGORIES.find(x => x.key === key);
    return item ? item.label : 'その他';
  }
  function getFiltered() {
    const query = els.search.value.trim().toLocaleLowerCase('ja');
    return records.filter(record => {
      const categoryMatch = activeFilter === 'all' || record.category === activeFilter;
      const text = [record.species,record.location,record.memo].map(safeText).join(' ').toLocaleLowerCase('ja');
      return categoryMatch && (!query || text.includes(query));
    });
  }
  function renderStats() {
    setText($('stat-records'),records.length);
    setText($('stat-species'),new Set(records.map(x => x.species).filter(Boolean)).size);
    setText($('stat-birds'),records.filter(x => x.category === 'bird').length);
  }
  function renderFilters() {
    const counts = {all:records.length};
    CATEGORIES.forEach(c => counts[c.key] = records.filter(x => x.category === c.key).length);
    els.filters.replaceChildren();
    [{key:'all',label:'すべて'},...CATEGORIES].forEach(c => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'filter' + (activeFilter === c.key ? ' active' : '');
      button.setAttribute('aria-pressed',String(activeFilter === c.key));
      button.textContent = c.label + ' · ' + counts[c.key];
      button.addEventListener('click',() => { activeFilter = c.key; render(); });
      els.filters.append(button);
    });
  }
  function createRecordNode(record) {
    const article = document.createElement('article');
    article.className = 'record';
    const thumb = document.createElement('div');
    thumb.className = 'thumb';
    if (record.image) {
      const img = document.createElement('img');
      img.src = record.image;
      img.alt = safeText(record.species) + 'の観察写真';
      thumb.append(img);
    } else {
      thumb.textContent = record.category === 'tree' ? '♧' : record.category === 'bird' ? '♬' : '◌';
    }
    const main = document.createElement('div');
    main.className = 'record-main';
    const title = document.createElement('div');
    title.className = 'species';
    setText(title,record.species || '種名未記入');
    const meta = document.createElement('div');
    meta.className = 'meta';
    setText(meta,[record.date,record.location,categoryLabel(record.category)].filter(Boolean).join(' ・ '));
    main.append(title,meta);
    if (record.memo) {
      const memo = document.createElement('div');
      memo.className = 'memo';
      setText(memo,record.memo);
      main.append(memo);
    }
    if (typeof record.confidence === 'number') {
      const confidence = document.createElement('span');
      confidence.className = 'confidence';
      setText(confidence,'AI判定 ' + Math.round(record.confidence * 100) + '%');
      main.append(confidence);
    }
    const remove = document.createElement('button');
    remove.type = 'button';
    remove.className = 'remove';
    remove.textContent = '削除';
    remove.setAttribute('aria-label',safeText(record.species) + 'の記録を削除');
    remove.addEventListener('click',() => {
      if (!window.confirm('「' + safeText(record.species) + '」の記録を削除しますか？')) return;
      records = records.filter(item => item.id !== record.id);
      persist();
      render();
    });
    article.append(thumb,main,remove);
    return article;
  }
  function renderList() {
    const shown = getFiltered();
    els.list.replaceChildren();
    setText($('shown-count'),shown.length + '件');
    if (!shown.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      const bird = document.createElement('div');
      bird.className = 'bird';
      bird.textContent = records.length ? '⌕' : '♬';
      const title = document.createElement('strong');
      setText(title,records.length ? '見つかりませんでした' : '最初の出会いを記録しましょう');
      const message = document.createElement('p');
      setText(message,records.length ? '検索語やカテゴリを変えてみてください。' : '写真からAI判定するか、手入力で記録できます。');
      empty.append(bird,title,message);
      els.list.append(empty);
      return;
    }
    shown.forEach(record => els.list.append(createRecordNode(record)));
  }
  function render() { renderStats(); renderFilters(); renderList(); }
  function persist() {
    try {
      localStorage.setItem(STORAGE_KEY,JSON.stringify(records));
      return true;
    } catch (error) {
      flash('端末の保存容量が足りません。写真のサイズを小さくしてください。');
      return false;
    }
  }
  function load() {
    try {
      const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      records = Array.isArray(parsed) ? parsed : [];
    } catch (_) { records = []; }
  }
  function showEntry() {
    els.home.style.display = 'none';
    els.entry.style.display = 'block';
    els.bottom.style.display = 'none';
    els.species.value = '';
    els.location.value = '';
    els.memo.value = '';
    els.date.value = today();
    photoData = null;
    confidenceValue = null;
    els.photoBox.innerHTML = '<div class="photo-placeholder"><span aria-hidden="true">📷</span><b>写真を追加</b><small>端末の写真から選べます</small></div>';
    els.aiStatus.textContent = '';
    els.aiStatus.classList.remove('error');
    els.recognize.disabled = false;
    chooseCategory('bird');
  }
  function showHome() {
    identificationRun++;
    els.entry.style.display = 'none';
    els.home.style.display = 'block';
    els.bottom.style.display = '';
    els.photoInput.value = '';
  }
  function chooseCategory(key) {
    selectedCategory = CATEGORIES.some(c => c.key === key) ? key : 'bird';
    document.querySelectorAll('.category-option').forEach(button => {
      button.classList.toggle('selected',button.dataset.category === selectedCategory);
      button.setAttribute('aria-pressed',String(button.dataset.category === selectedCategory));
    });
  }
  function compressImage(file) {
    return new Promise((resolve,reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('画像を読み込めませんでした。'));
      reader.onload = () => {
        const image = new Image();
        image.onerror = () => reject(new Error('画像形式を読み取れませんでした。'));
        image.onload = () => {
          const maxSide = 1200;
          const scale = Math.min(1,maxSide / Math.max(image.width,image.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.max(1,Math.round(image.width * scale));
          canvas.height = Math.max(1,Math.round(image.height * scale));
          const context = canvas.getContext('2d');
          if (!context) { reject(new Error('画像の処理を開始できません。')); return; }
          context.drawImage(image,0,0,canvas.width,canvas.height);
          resolve(canvas.toDataURL('image/jpeg',0.78));
        };
        image.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }
  async function identify(dataUrl,runId) {
    try {
      const response = await fetch(API_ENDPOINT,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({image:dataUrl})
      });
      let result = {};
      try { result = await response.json(); } catch (_) {}
      if (!response.ok) throw new Error(result.error || 'AI判定に失敗しました (' + response.status + ')');
      if (!result.species) throw new Error('AIから種名を受け取れませんでした。');
      if (runId !== identificationRun) return;
      els.species.value = result.species;
      els.memo.value = result.note || '';
      chooseCategory(result.category || 'bird');
      const confidence = Number(result.confidence);
      confidenceValue = Number.isFinite(confidence) ? Math.max(0,Math.min(1,confidence)) : null;
      const percent = confidenceValue === null ? null : Math.round(confidenceValue * 100);
      els.aiStatus.textContent = '判定結果：' + result.species + (percent === null ? '' : ' ・ 確信度 ' + percent + '%') + '。内容を確認して記録してください。';
    } catch (error) {
      if (runId !== identificationRun) return;
      els.aiStatus.textContent = error.message || 'AI判定に失敗しました。種名を手入力できます。';
      els.aiStatus.classList.add('error');
    }
  }
  async function recognizeSelectedPhoto() {
    if (!photoData) {
      els.aiStatus.textContent = '先に写真を選んでください。';
      els.aiStatus.classList.add('error');
      return;
    }
    const runId = ++identificationRun;
    els.recognize.disabled = true;
    els.aiStatus.classList.remove('error');
    els.aiStatus.textContent = 'AIが写真を判定しています…';
    try {
      await identify(photoData,runId);
    } finally {
      if (runId === identificationRun) els.recognize.disabled = false;
    }
  }
  async function onPhotoSelected(event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    const alreadyEditing = els.entry.style.display === 'block';
    if (!alreadyEditing) showEntry();
    const runId = ++identificationRun;
    confidenceValue = null;
    els.recognize.disabled = false;
    els.aiStatus.classList.remove('error');
    els.aiStatus.textContent = '写真を読み込んでいます…';
    try {
      photoData = await compressImage(file);
      if (runId !== identificationRun) return;
      const img = document.createElement('img');
      img.src = photoData;
      img.alt = '選択した観察写真';
      els.photoBox.replaceChildren(img);
      els.aiStatus.classList.remove('error');
      if (alreadyEditing) {
        els.aiStatus.textContent = '写真を読み込みました。「AI判定して入力」を押してください。';
      } else {
        els.aiStatus.textContent = 'AIが写真を判定しています…';
        await identify(photoData,runId);
      }
    } catch (error) {
      if (runId === identificationRun) {
        els.aiStatus.textContent = error.message || '画像を処理できませんでした。';
        els.aiStatus.classList.add('error');
      }
    } finally {
      event.target.value = '';
    }
  }
  function saveRecord() {
    const species = els.species.value.trim();
    if (!species) {
      els.aiStatus.textContent = '種名を入力してください。';
      els.aiStatus.classList.add('error');
      els.species.focus();
      return;
    }
    const record = {
      id:String(Date.now()) + '-' + Math.random().toString(36).slice(2,7),
      species,
      category:selectedCategory,
      date:els.date.value || today(),
      location:els.location.value.trim(),
      memo:els.memo.value.trim(),
      confidence:confidenceValue,
      image:photoData,
      createdAt:new Date().toISOString()
    };
    if (!persistCandidate(record)) return;
    showHome();
    render();
    flash('観察記録を保存しました。');
  }
  function persistCandidate(record) {
    const next = [record,...records];
    try {
      localStorage.setItem(STORAGE_KEY,JSON.stringify(next));
      records = next;
      return true;
    } catch (_) {
      els.aiStatus.textContent = '保存容量が不足しています。写真のサイズを小さくするか、画像なしで保存してください。';
      els.aiStatus.classList.add('error');
      return false;
    }
  }
  function exportRecords() {
    if (!records.length) { flash('書き出す記録がありません。'); return; }
    const blob = new Blob([JSON.stringify(records,null,2)],{type:'application/json'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'shiratsuchi-observations-' + today() + '.json';
    link.click();
    URL.revokeObjectURL(url);
    flash('観察記録を書き出しました。');
  }
  $('new-record-btn').addEventListener('click',showEntry);
  els.homePhotoInput.addEventListener('change',onPhotoSelected);
  $('choose-photo-btn').addEventListener('click',() => els.photoInput.click());
  $('recognize-photo-btn').addEventListener('click',recognizeSelectedPhoto);
  $('back-btn').addEventListener('click',showHome);
  $('cancel-btn').addEventListener('click',showHome);
  $('save-btn').addEventListener('click',saveRecord);
  $('export-btn').addEventListener('click',exportRecords);
  els.search.addEventListener('input',renderList);
  els.photoInput.addEventListener('change',onPhotoSelected);
  document.querySelectorAll('.category-option').forEach(button => button.addEventListener('click',() => chooseCategory(button.dataset.category)));
  load();
  render();
})();
</script>
</body>
</html>
