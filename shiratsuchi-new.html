<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>白土｜野鳥フィールドノート</title>
<style>
:root{--bg:#0e1712;--panel:#17231b;--panel2:#203027;--line:#314438;--text:#edf4ed;--muted:#9caf9f;--green:#78b77e;--green2:#4d8b57}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0b130e,#132019);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
#app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:92px}.hero{padding:28px 20px 18px}.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--muted)}h1{font-size:30px;margin:5px 0}.sub{color:var(--muted);font-size:13px}.stats{display:flex;gap:9px;margin-top:18px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 13px;flex:1}.stat b{display:block;font-size:21px}.stat span{font-size:11px;color:var(--muted)}
.filters{display:flex;gap:8px;overflow:auto;padding:0 20px 16px}.filter{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:9px 13px;border-radius:999px;white-space:nowrap}.filter.active{color:#fff;border-color:var(--green2);background:var(--panel2)}
#list{padding:0 20px}.card{display:grid;grid-template-columns:82px 1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.thumb{width:82px;height:82px;border-radius:12px;overflow:hidden;background:var(--panel2)}.thumb img{width:100%;height:100%;object-fit:cover}.species{font-size:18px;font-weight:700;margin:2px 0 5px}.meta,.memo{font-size:12px;color:var(--muted)}.memo{margin-top:7px;line-height:1.5}.delete{background:none;border:0;color:#718075;font-size:11px}
.empty{text-align:center;color:var(--muted);padding:60px 20px}.empty b{display:block;color:var(--text);font-size:18px;margin-bottom:8px}
#entry{display:none;padding:20px}.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}.back{background:none;border:0;color:#fff;font-size:25px}.top h2{margin:0;font-size:20px}.photo{height:280px;border:1px dashed var(--line);border-radius:18px;background:var(--panel);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted);text-align:center}.photo img{width:100%;height:100%;object-fit:cover}.ai{color:var(--green);font-size:12px;min-height:18px;margin:10px 2px}.field{margin:14px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field input,.field textarea{width:100%;border:1px solid var(--line);background:var(--panel);color:#fff;border-radius:10px;padding:12px;font:inherit}.cats{display:flex;gap:8px}.cat{flex:1;padding:10px;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:10px}.cat.sel{border-color:var(--green2);color:#fff}.save{width:100%;padding:14px;border:0;border-radius:999px;background:var(--green2);color:#fff;font-weight:700;font-size:15px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(14,23,18,.94);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom));display:flex;gap:9px;max-width:520px;margin:auto}.bottom button,.bottom label{flex:1;text-align:center;padding:14px;border-radius:999px;background:var(--green2);color:#fff;font-weight:700}.bottom label{display:block;cursor:pointer}.bottom input{display:none}
</style>
</head>
<body>
<div id="app">
<section id="home">
<header class="hero"><div class="eyebrow">SHIRATSUCHI / FIELD NOTE</div><h1>白土</h1><div class="sub">白神山地と周辺で出会った生きものを記録する</div><div class="stats"><div class="stat"><b id="records">0</b><span>記録</span></div><div class="stat"><b id="species">0</b><span>種</span></div><div class="stat"><b id="birds">0</b><span>野鳥</span></div></div></header>
<nav class="filters" id="filters"></nav><main id="list"></main></section>
<section id="entry"><div class="top"><button class="back" id="back">‹</button><h2>観察を記録</h2></div><div class="photo" id="photo">写真を選択するとAI判定できます</div><div class="ai" id="ai"></div><div class="field"><label>種名</label><input id="name" placeholder="例：コサメビタキ"></div><div class="field"><label>分類</label><div class="cats"><button class="cat sel" data-cat="bird">鳥</button><button class="cat" data-cat="other">その他</button><button class="cat" data-cat="tree">樹木</button></div></div><div class="field"><label>日付</label><input id="date" type="date"></div><div class="field"><label>場所</label><input id="location" placeholder="例：二ツ井・田んぼ"></div><div class="field"><label>メモ</label><textarea id="memo" rows="4" placeholder="行動、環境、気づいたこと"></textarea></div><button class="save" id="save">記録する</button></section>
<div class="bottom"><button id="new">＋ 記録を追加</button><label>📷 写真から判定<input id="file" type="file" accept="image/*"></label></div>
</div>
<script>
const KEY="shiratsuchi_v2";let records=JSON.parse(localStorage.getItem(KEY)||"[]"),filter="all",cat="bird",image=null;
const $=id=>document.getElementById(id),today=()=>new Date().toISOString().slice(0,10);
function render(){ $("records").textContent=records.length;$("species").textContent=new Set(records.map(x=>x.species).filter(Boolean)).size;$("birds").textContent=records.filter(x=>x.category==="bird").length;
$("filters").innerHTML=["all","bird","other","tree"].map(x=>'<button class="filter '+(filter===x?"active":"")+'" data-filter="'+x+'">'+({all:"すべて",bird:"野鳥",other:"その他",tree:"樹木"}[x])+"</button>").join("");
document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});
let a=records.filter(x=>filter==="all"||x.category===filter);$("list").innerHTML=a.length?a.map(x=>'<article class="card"><div class="thumb">'+(x.image?'<img src="'+x.image+'">':"")+'</div><div><div class="species">'+esc(x.species)+'</div><div class="meta">'+esc(x.date||"")+(x.location?" ・ "+esc(x.location):"")+'</div><div class="memo">'+esc(x.memo||"")+'</div></div><button class="delete" data-id="'+x.id+'">削除</button></article>').join(""):'<div class="empty"><b>まだ記録がありません</b>写真や観察内容をここに残せます。</div>';
document.querySelectorAll(".delete").forEach(b=>b.onclick=()=>{records=records.filter(x=>x.id!==b.dataset.id);save();render()})}
function esc(s){let d=document.createElement("div");d.textContent=s||"";return d.innerHTML}function save(){localStorage.setItem(KEY,JSON.stringify(records))}
function open(){home.style.display="none";entry.style.display="block";$("date").value=today();$("ai").textContent=""}
function close(){entry.style.display="none";home.style.display="block"}
new.onclick=open;back.onclick=close;document.querySelectorAll(".cat").forEach(b=>b.onclick=()=>{cat=b.dataset.cat;document.querySelectorAll(".cat").forEach(x=>x.classList.toggle("sel",x===b))});
file.onchange=async e=>{let f=e.target.files[0];if(!f)return;open();let r=new FileReader();r.onload=async()=>{image=r.result;photo.innerHTML='<img src="'+image+'">';ai.textContent="AIで野鳥を判定中…";try{let q=await fetch("/api/identify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({image})});let d=await q.json();if(q.ok){name.value=d.species||"";memo.value=d.note||"";cat=d.category||"bird";document.querySelectorAll(".cat").forEach(x=>x.classList.toggle("sel",x.dataset.cat===cat));ai.textContent="AI判定: "+d.species}else ai.textContent="AI判定を利用できません: "+(d.error||"unknown error")}catch(_){ai.textContent="AIサーバーに接続できません"}};r.readAsDataURL(f)};
save.onclick=()=>{if(!name.value.trim())return;records.unshift({id:Date.now().toString(),species:name.value.trim(),category:cat,date:date.value||today(),location:location.value.trim(),memo:memo.value.trim(),image,createdAt:new Date().toISOString()});save();name.value="";location.value="";memo.value="";image=null;photo.textContent="写真を選択するとAI判定できます";close();render()};
render();
</script>
</body></html>
